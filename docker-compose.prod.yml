# ============================================================
# GD Diagnóstico Logístico — Ambiente de PRODUÇÃO
# ============================================================
# Uso:
#   cp backend/.env.example backend/.env   # ajuste SECRET_KEY, senhas
#   docker network create gd_conecta_network   # uma única vez no servidor
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Este servidor hospeda mais de uma aplicação (GD Diagnóstico + GD CRM +
# Portal do Cliente). Por isso os frontends NÃO expõem as portas 80/443
# diretamente — quem faz isso é o Nginx central em /opt (nginx-proxy.conf),
# que termina o TLS para os domínios e encaminha para cada app por dentro
# da rede Docker compartilhada 'gd_conecta_network'.
#
# Aplicação disponível em: https://diagnostico.gdconecta.com.br
# Portal do Cliente (v6.18.0) em: https://portal.gdconecta.com.br
# ============================================================

services:

  # ---- Banco de Dados -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: gd_frete_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gd_pg_prod_data:/var/lib/postgresql/data
    # Porta NÃO exposta externamente em produção.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gd_conecta_network

  # ---- Backend --------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: gd_frete_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Usa o container_name (gd_frete_db), não o alias curto 'db' — em
      # 'gd_conecta_network' (externa, compartilhada com o GD CRM), o alias
      # 'db' não é único: se o outro projeto também nomear seu serviço 'db',
      # o DNS embutido do Docker pode resolver para o container ERRADO
      # (achado real em produção: o backend chegou a conectar no Postgres
      # do CRM em vez do próprio, causando 'password authentication failed'
      # intermitente). container_name é único em toda a rede compartilhada.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@gd_frete_db:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      DEBUG: "false"
    # Porta NÃO exposta diretamente — tráfego via frontend/nginx.
    expose:
      - "8000"
    command: >
      sh -c "
        python -m alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    networks:
      - gd_conecta_network

  # ---- Frontend (nginx) -----------------------------------------
  # HTTP puro na porta 80, apenas dentro da rede Docker. Quem expõe
  # 80/443 ao mundo é o Nginx central (fora deste projeto).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1   # proxy reverso: /api/v1 → backend:8000/api/v1
    container_name: gd_frete_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - gd_conecta_network

  # ---- Portal do Cliente — Frontend (v6.18.0) --------------------
  # App separado do painel do analista (outro build, outra origem).
  # Mesmo backend (gd_frete_backend) — audiência isolada por cookie/claim.
  frontend-portal:
    build:
      context: ./frontend-portal
      args:
        VITE_API_URL: /api/v1/portal
    container_name: gd_frete_frontend_portal
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - gd_conecta_network

volumes:
  gd_pg_prod_data:

networks:
  gd_conecta_network:
    external: true
