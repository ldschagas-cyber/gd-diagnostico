# Este container só fala HTTP puro na porta 80, dentro da rede Docker
# interna. O TLS é terminado pelo Nginx central (fora deste projeto),
# que roteia portal.gdconecta.com.br até aqui. Mesmo backend do painel
# do analista (gd_frete_backend) — a audiência é separada por cookie/
# claim JWT, não por servidor.
server {
    listen 80;
    server_name portal.gdconecta.com.br;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Frontend — React SPA (rotas client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — proxy reverso para o backend FastAPI (mesmo container do painel
    # interno; as rotas /api/v1/portal/* já são a audiência isolada).
    location /api/ {
        proxy_pass http://gd_frete_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
