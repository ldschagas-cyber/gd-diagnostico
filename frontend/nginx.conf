# Este container só fala HTTP puro na porta 80, dentro da rede Docker
# interna. O TLS é terminado pelo Nginx central (fora deste projeto),
# que roteia diagnostico.gdconecta.com.br até aqui. Não há certificado
# nem redirecionamento para HTTPS neste arquivo — quem cuida disso é o
# proxy central.
server {
    listen 80;
    server_name diagnostico.gdconecta.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Limite de upload: Excel até 20 MB + margem para headers
    client_max_body_size 25M;

    # Frontend — React SPA (rotas client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — proxy reverso para o backend FastAPI
    location /api/ {
        proxy_pass http://gd_frete_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;   # uploads de XML/Excel
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
